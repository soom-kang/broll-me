<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>/*TITLE*/ B-roll</title>
<style>
/*FONT_CSS*/
:root{
  --bg:#E9E7E2; --panel:#FFFFFF; --ink:#0B0B0B; --muted:#7D7A74; --line:#DEDAD3; --soft:#F3F1ED; --acc:#FF5A1F; --stage:#D9D6D0;
  --sans:'Geist','Noto Sans KR',system-ui,-apple-system,sans-serif; --mono:'Geist Mono','Noto Sans KR',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141412;--panel:#1D1C1A;--ink:#F2F0EC;--muted:#9C9891;--line:#34322E;--soft:#262522;--stage:#0B0B0A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141412;--panel:#1D1C1A;--ink:#F2F0EC;--muted:#9C9891;--line:#34322E;--soft:#262522;--stage:#0B0B0A;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:28px 48px;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px}
h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:14px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:1fr}}
.player{background:var(--panel);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05),0 12px 32px -14px rgba(0,0,0,.18)}
.screen{position:relative;aspect-ratio:16/9;background:var(--stage);max-width:100%}
video{position:absolute;inset:0;width:100%;height:100%;display:block}
.info{padding:16px 18px 18px;display:grid;gap:10px}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.tc{font-family:var(--mono);font-size:13px;background:var(--soft);border-radius:8px;padding:3px 9px;font-variant-numeric:tabular-nums}
.tag{font-size:12px;font-weight:500;color:#fff;background:var(--acc);border-radius:999px;padding:2px 9px}
.title{font-size:19px;font-weight:600;letter-spacing:-.015em;margin:0}
.quote{margin:0;color:var(--muted);font-size:15px;max-width:65ch}
.file{font-family:var(--mono);font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-size:14px;font-weight:500;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:7px 13px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:disabled{cursor:not-allowed;opacity:.55}
.media-status{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px;font-size:14px}
.media-status[hidden]{display:none}
.media-status p{margin:0}
.media-status button{justify-self:start}
.spacer{flex:1}
.hint{font-size:12.5px;color:var(--muted)}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.item button{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;text-align:left;background:var(--panel);border:1px solid transparent;border-radius:14px;padding:11px 12px}
.item button[aria-current="true"]{border-color:var(--ink)}
.num{font-family:var(--mono);font-size:13px;width:34px;height:34px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center}
.item button[aria-current="true"] .num{background:var(--acc);color:#fff}
.it{font-weight:600;font-size:14.5px;letter-spacing:-.01em}
.iq{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.itc{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.foot{font-size:13px;color:var(--muted);max-width:75ch}
@media (prefers-reduced-motion: reduce){video{animation:none}}
</style>

<div class="wrap">
  <header>
    <h1>/*TITLE*/ · B-roll</h1>
    <span class="sub">/*SUB*/</span>
  </header>
  <div class="main">
    <section class="player" aria-label="Clip player">
      <div class="screen"><video id="vid" playsinline muted loop preload="auto"></video></div>
      <div class="info">
        <div class="meta"><span class="tc" id="tc"></span><button type="button" id="snd" style="padding:3px 10px;font-size:13px">Sound on</button><span class="tag" id="tag" hidden>Transparent overlay</span></div>
        <h2 class="title" id="title"></h2>
        <p class="quote" id="quote"></p>
        <div class="file" id="file"></div>
        <div class="controls">
          <button id="prev" type="button">← Prev</button>
          <button id="play" type="button" class="primary" disabled>Play</button>
          <button id="next" type="button">Next →</button>
          <span class="spacer"></span>
          <label class="hint"><input type="checkbox" id="auto"> Play all in order</label>
        </div>
        <div class="media-status" id="media-status" role="status" aria-live="polite" hidden>
          <p id="media-message"></p>
          <div class="file" id="failed-source"></div>
          <button id="retry" type="button">Retry media</button>
        </div>
      </div>
    </section>
    <ol class="list" id="list"></ol>
  </div>
  <p class="foot">The timecode is where each clip goes in your edit. Transparent panel clips are shown here on black; in your edit they sit in the empty area of the shot. Arrow keys switch clips and space pauses.</p>
</div>

<script>
const CLIPS=/*CLIPS*/[];
const $=id=>document.getElementById(id);
const vid=$('vid'), list=$('list');
let cur=0, touched=false, generation=0, mediaState='loading', soundEnabled=null;
addEventListener('pointerdown',()=>{touched=true;},{capture:true}); addEventListener('keydown',()=>{touched=true;},{capture:true});
for (const [i,c] of CLIPS.entries()) {
  const item=document.createElement('li');item.className='item';
  const button=document.createElement('button');button.type='button';button.dataset.i=String(i);
  const number=document.createElement('span');number.className='num';number.textContent=c.n;
  const metadata=document.createElement('span');
  for(const [className,text] of [['it',c.t],['itc',c.tc],['iq',c.q]]){
    const element=document.createElement('div');element.className=className;element.textContent=text;metadata.append(element);
  }
  button.append(number,metadata);item.append(button);list.append(item);
}
function syncControls(){
  const unavailable=mediaState==='loading'||mediaState==='error';
  $('play').textContent=mediaState==='playing'?'Pause':'Play'; $('play').disabled=unavailable;
  $('snd').disabled=unavailable; $('auto').disabled=unavailable;
  $('snd').textContent=vid.muted?'Sound on':'Sound off';
}
function clearStatus(){
  $('media-status').hidden=true; $('media-message').textContent=''; $('failed-source').textContent=''; $('retry').hidden=true;
}
function status(message,canRetry){
  $('media-message').textContent=message; $('failed-source').textContent=canRetry?(vid.getAttribute('src')||CLIPS[cur].src):'';
  $('retry').hidden=!canRetry; $('media-status').hidden=false;
}
function failed(message){
  mediaState='error'; syncControls(); status(message,true);
}
function currentSource(){
  return !vid.currentSrc||vid.currentSrc===new URL(CLIPS[cur].src,document.baseURI).href;
}
function requestPlay(token=generation){
  if(mediaState==='error')return;
  try{
    Promise.resolve(vid.play()).catch(error=>{
      if(token!==generation||error.name==='AbortError')return;
      if(mediaState==='error')return;
      if(error.name==='NotAllowedError'){
        mediaState='paused'; syncControls(); status('Playback was blocked. Select Play to start this clip.',false);
      }else failed('This clip could not be played. Check the file and format, then retry.');
    });
  }catch(error){
    if(token===generation)failed('This clip could not be played. Check the file and format, then retry.');
  }
}
function show(i,retry=false){
  const muted=vid.muted;
  cur=(i+CLIPS.length)%CLIPS.length; const c=CLIPS[cur];
  generation++; mediaState='loading'; clearStatus();
  $('tc').textContent=c.tc; $('title').textContent=c.n+' · '+c.t; $('quote').textContent=c.q; $('file').textContent=c.f; $('tag').hidden=!c.alpha;
  vid.loop=!$('auto').checked; vid.muted=retry?muted:!(c.full&&(soundEnabled===null?touched:soundEnabled));
  $('snd').hidden=!c.full; syncControls(); vid.src=c.src; vid.load(); requestPlay();
  list.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',String(+b.dataset.i===cur)));
}
list.addEventListener('click',e=>{const b=e.target.closest('button[data-i]'); if(b) show(+b.dataset.i);});
$('snd').onclick=()=>{vid.muted=!vid.muted;soundEnabled=!vid.muted;syncControls();};
$('prev').onclick=()=>show(cur-1); $('next').onclick=()=>show(cur+1);
$('play').onclick=()=>{if(vid.paused||vid.ended)requestPlay();else vid.pause();};
$('auto').onchange=()=>{vid.loop=!$('auto').checked; if($('auto').checked){vid.currentTime=0;requestPlay();}};
$('retry').onclick=()=>show(cur,true);
vid.addEventListener('loadstart',()=>{if(currentSource()){mediaState='loading';syncControls();}});
vid.addEventListener('canplay',()=>{if(currentSource()&&mediaState!=='error'){if(mediaState==='loading')mediaState='paused';syncControls();}});
vid.addEventListener('playing',()=>{if(currentSource()&&!vid.error){mediaState='playing';clearStatus();syncControls();}});
vid.addEventListener('pause',()=>{if(currentSource()&&mediaState!=='loading'&&mediaState!=='error'){mediaState='paused';syncControls();}});
vid.addEventListener('ended',()=>{if(currentSource()&&mediaState!=='error'){mediaState='ended';syncControls();if($('auto').checked)show(cur+1);}});
vid.addEventListener('error',()=>{
  if(!currentSource()||!vid.error)return;
  const message=vid.error.code===3?'This media file could not be decoded. Check the format, then retry.':vid.error.code===4?'This media file is missing or its format is unsupported. Check the file, then retry.':'This media file could not be loaded. Check the file path, then retry.';
  failed(message);
});
document.addEventListener('keydown',e=>{
  const target=e.target;
  if(e.defaultPrevented||e.isComposing||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;
  if(target instanceof Element&&(target.isContentEditable||target.closest('button,input,select,textarea,a[href],summary,audio[controls],video[controls],[role="button"],[role="checkbox"],[role="radio"],[role="switch"],[role="slider"],[role="spinbutton"],[role="textbox"],[role="combobox"],[role="listbox"],[role="menuitem"],[role="tab"]')))return;
  if(e.key==='ArrowRight'){show(cur+1);e.preventDefault();} else if(e.key==='ArrowLeft'){show(cur-1);e.preventDefault();} else if(e.key===' '&&!$('play').disabled){$('play').click();e.preventDefault();}
});
show(0);
</script>

</html>
